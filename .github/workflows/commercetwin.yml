name: CommerceTwin Regression

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run CommerceTwin Regression Cohort
        run: |
          cd backend
          PYTHONPATH=. python scripts/run_regression.py
        env:
          APP_ENV: testing
          RAZORPAY_KEY_ID: mock_key
          RAZORPAY_KEY_SECRET: mock_secret
