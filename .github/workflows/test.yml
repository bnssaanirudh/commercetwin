name: Test and Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAZORPAY_KEY_ID: rzp_test_CI_PLACEHOLDER
      RAZORPAY_KEY_SECRET: ci_secret_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff — strict, no suppressions)
        run: python -m ruff check app tests

      - name: Unit + integration tests
        run: python -m pytest tests -v --tb=short

      - name: Coverage (must meet threshold)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=60 tests

  # ── Regression ───────────────────────────────────────────────────────────────
  regression:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    env:
      RAZORPAY_KEY_ID: rzp_test_CI_PLACEHOLDER
      RAZORPAY_KEY_SECRET: ci_secret_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run regression suite
        run: python ../scripts/run_regression.py

  # ── Benchmark smoke ───────────────────────────────────────────────────────────
  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    env:
      RAZORPAY_KEY_ID: rzp_test_CI_PLACEHOLDER
      RAZORPAY_KEY_SECRET: ci_secret_placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Benchmark smoke (val split, must complete without crash)
        run: |
          python ../evals/run_benchmark.py --system commercetwin --split val --seed 42
          python ../evals/run_benchmark.py --system keyword --split val --seed 42
          python ../evals/run_benchmark.py --system semantic --split val --seed 42
          python ../evals/run_benchmark.py --system llm_only --split val --seed 42

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint (strict — no || true)
        run: npm run lint

      - name: Type-check (strict — no || true)
        run: npx tsc -b

      - name: Build (must succeed)
        run: npm run build
