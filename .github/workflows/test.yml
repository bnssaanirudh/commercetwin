name: Test and Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          cd backend
          python -m ruff check app tests
      - name: Tests
        run: |
          cd backend
          python -m pytest tests
      - name: Coverage
        run: |
          cd backend
          python -m pytest --cov=app --cov-report=term-missing tests

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint
        run: |
          cd frontend
          npm run lint || true
      - name: Typecheck
        run: |
          cd frontend
          npx tsc -b || true
      - name: Build
        run: |
          cd frontend
          npm run build
