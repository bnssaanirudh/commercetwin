<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Test Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        button { background: #528FF0; color: white; border: none; padding: 12px 24px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #4070d6; }
        .log { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 12px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Test Mode Checkout</h1>
    <p>Click below to simulate a CommerceTwin payment via Razorpay Test Mode.</p>
    <button id="pay-btn">Pay ₹100.00 (Test Mode)</button>

    <div class="log" id="log-box">Waiting to start...</div>

    <script>
        const API_BASE = "http://localhost:8000/api/payments";
        const logBox = document.getElementById('log-box');

        function log(msg, type = "info") {
            const span = document.createElement("span");
            if (type === "success") span.className = "success";
            if (type === "error") span.className = "error";
            span.textContent = msg + "\n";
            logBox.appendChild(span);
        }

        document.getElementById('pay-btn').onclick = async function (e) {
            e.preventDefault();
            logBox.innerHTML = "";
            log("Starting transaction...");

            try {
                // 1. Create order on the server
                log("Calling POST /api/payments/order...");
                const orderRes = await fetch(`${API_BASE}/order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trace_id: "TRC-TEST-123" }) // Match OrderCreateRequest schema
                });
                
                if (!orderRes.ok) throw new Error(await orderRes.text());
                const orderData = await orderRes.json();
                log(`Order created: ${orderData.order_id}`, "success");

                // 2. Initialize Razorpay Checkout
                const options = {
                    key: orderData.key_id,
                    amount: orderData.amount,
                    currency: orderData.currency,
                    name: "CommerceTwin Test",
                    description: "Test Transaction",
                    order_id: orderData.order_id,
                    handler: async function (response) {
                        log("Payment successful! Signature received. Verifying on server...");
                        
                        // 3. Verify signature on server
                        try {
                            const verifyRes = await fetch(`${API_BASE}/verify`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature
                                })
                            });
                            
                            if (!verifyRes.ok) throw new Error(await verifyRes.text());
                            log("Signature verified successfully on server!", "success");
                        } catch (err) {
                            log("Verification failed: " + err.message, "error");
                        }
                    },
                    prefill: {
                        name: "Test Buyer",
                        email: "buyer@commercetwin.test",
                        contact: "9999999999"
                    },
                    theme: { color: "#528FF0" }
                };

                const rzp1 = new Razorpay(options);
                rzp1.on('payment.failed', function (response){
                    log(`Payment failed: ${response.error.description}`, "error");
                });
                rzp1.open();
                
            } catch (err) {
                log("Transaction aborted: " + err.message, "error");
            }
        };
    </script>
</body>
</html>
