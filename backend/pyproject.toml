[project]
name = "commercetwin-backend"
version = "0.1.0"
description = "Backend for CommerceTwin digital twin and chaos lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "httpx>=0.27.2",
    "requests",
    "razorpay",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "ruff>=0.6.9"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE", "LOG", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in default params is the documented pattern
    "B904",    # raise-from: some exception chains are intentional "from None" suppressions
    "BLE001",  # Catching broad Exception is sometimes necessary for resilience
    "E501",    # Line length: enforced by code review, not strictly in CI
    "LOG004",  # logger.exception outside handler: used in global handler
    "RUF003",  # Ambiguous × char in comment — cosmetic, not logic
    "RUF012",  # Mutable class vars — handled via ClassVar annotation where needed
]
